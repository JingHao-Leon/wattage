      output: 25.0e-6
      cache_read_mult: 0.10
      cache_write_mult: 1.25
      cache_write_mult_1h: 2.0
      min_cacheable_prefix_tokens: 2048
    claude-opus-4-6:
      input: 5.0e-6
      output: 25.0e-6
      cache_read_mult: 0.10
      cache_write_mult: 1.25
      cache_write_mult_1h: 2.0
      min_cacheable_prefix_tokens: 4096
    claude-opus-4-5:
      input: 5.0e-6
      output: 25.0e-6
      cache_read_mult: 0.10
      cache_write_mult: 1.25
      cache_write_mult_1h: 2.0
      min_cacheable_prefix_tokens: 4096
    claude-sonnet-4-6:
      input: 3.0e-6
      output: 15.0e-6
      cache_read_mult: 0.10
      cache_write_mult: 1.25
      cache_write_mult_1h: 2.0
      min_cacheable_prefix_tokens: 1024
    claude-sonnet-4-5:
      input: 3.0e-6
      output: 15.0e-6
