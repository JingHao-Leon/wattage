# Vendored pricing snapshot (doc §7.5 / Appendix B).
#
# This is DATA, not gospel: prices change and this file will drift. It is
# versioned and user-overridable (see PricingRegistry.load(overrides_path=...)).
# Every number below was pulled from the provider's own pricing page on the
# date in `version` — re-verify before trusting this for a real invoice.
#
# Sources (all fetched 2026-08-23):
#   https://platform.claude.com/docs/en/about-claude/pricing
#   https://platform.claude.com/docs/en/build-with-claude/prompt-caching
#   https://developers.openai.com/api/docs/pricing
#   https://developers.openai.com/api/docs/guides/prompt-caching
#   https://mistral.ai/pricing/api
#   https://docs.mistral.ai/api/          (prompt_cache_key / cached-token rate)
#   https://ai.google.dev/gemini-api/docs/pricing
#   https://docs.x.ai/docs/models
#
# Schema notes (see registry.py for the full contract):
#   - Rates are $/token (so $2/MTok = 2.0e-6).
#   - cache_read_per_token / cache_write_per_token: absolute cached-input
#     rates, used where the provider publishes a dollar figure rather than a
#     multiplier. They win over cache_read_mult/cache_write_mult.
#   - cache_write_mult_1h: Anthropic's 1-hour-TTL cache writes bill at 2x
#     base input (5-minute writes at 1.25x). The 1h rate is only applied
#     when the trace itself carries a TTL breakdown (Claude Code session
#     logs do); OTel gen_ai.* usage attributes have no TTL split, so those
#     traces price all writes at the 5-minute rate — a documented, modest
#     underestimate for 1h-heavy workloads.
#   - tiers: providers that reprice the whole request once the prompt
#     crosses a token threshold (Gemini >200k, Grok >=200k). A tier with
#     `unpriced: true` marks a range whose rate is not published (OpenAI
#     models showing "<272K" pricing only) — calls there are left unpriced,
#     never guessed at the wrong tier.
#   - rates: dated windows for prices with a published effective period
#     (Gemini 3.7/3.6 Flash promo pricing through 2026-12-31).
#
# Deliberately NOT included:
#   - DeepSeek: publishes time-of-day rates (peak/off-peak differ 2x, with
#     cache hits at ~3% of input — not 10%). That shape doesn't fit this
#     registry yet; excluding it beats silently mispricing half a day's
#     traffic. Supply a --pricing override if your traces are DeepSeek and
#     your traffic sits in one window.
#   - Bedrock/Vertex model ids: partner pricing genuinely differs from
#     first-party rates (Anthropic documents a regional premium), so
#     "us.anthropic.*" ids are NOT silently priced at first-party rates.
#   - Gemini context-cache STORAGE ($/MTok/hour) — a time-based charge that
#     can't be attributed to a span. Gemini cached-read token rates below
#     are real, but a cache-storage-heavy workload costs more than the
#     per-token figures show. Documented, not guessed.
version: "2026-08-23-verified"

providers:
  anthropic:
    # Claude 5 family. Note: claude-sonnet-5's launch pricing ($2/$10) was
    # made the permanent standard price (the previously scheduled 2026-09-01
    # increase to $3/$15 was cancelled — pricing page note
    # "claude-sonnet-5-introductory-pricing", checked 2026-08-23).
    claude-fable-5:
      input: 10.0e-6
      output: 50.0e-6
      cache_read_mult: 0.10
      cache_write_mult: 1.25
      cache_write_mult_1h: 2.0
      min_cacheable_prefix_tokens: 512
    claude-mythos-5:
      input: 10.0e-6
      output: 50.0e-6
      cache_read_mult: 0.10
      cache_write_mult: 1.25
      cache_write_mult_1h: 2.0
      min_cacheable_prefix_tokens: 512
    claude-opus-5:
      input: 5.0e-6
      output: 25.0e-6
      cache_read_mult: 0.10
      cache_write_mult: 1.25
      cache_write_mult_1h: 2.0
      min_cacheable_prefix_tokens: 512
    claude-sonnet-5:
      input: 2.0e-6
      output: 10.0e-6
      cache_read_mult: 0.10
      cache_write_mult: 1.25
      cache_write_mult_1h: 2.0
